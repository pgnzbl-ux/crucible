# Crucible Nginx 反代 — API(8010) + 前端静态 + SSE 透传
# 安装: cp nginx-crucible.conf /etc/nginx/conf.d/crucible.conf && nginx -t && systemctl reload nginx
#
# 前置: 前端已构建（frontend/dist）；证书路径按实际替换（示例用 certbot）
# 可选限流（写在 http{} 内，非本文件）：
#   limit_req_zone $binary_remote_addr zone=crucible_api:10m rate=10r/s;
# 然后在 location /api/ 加：limit_req zone=crucible_api burst=40 nodelay;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name crucible.example.com;          # ← 替换
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name crucible.example.com;          # ← 替换

    ssl_certificate     /etc/letsencrypt/live/crucible.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crucible.example.com/privkey.pem;

    # ── 前端静态 ──
    root /opt/crucible/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;      # SPA 路由回退
    }

    # ── API 反代 ──
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 与后端 tasks/projects 上传上限对齐（200MB）
        client_max_body_size 200m;
    }

    # ── SSE：禁缓冲 + 长读超时；access 日志勿记 query（ticket/token）──
    location /api/v1/tasks/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
        access_log off;
        client_max_body_size 200m;
    }

    # ── metrics：仅本机 / 内网（应用层另需 METRICS_TOKEN Bearer）──
    location /metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8010;
    }

    location /health {
        proxy_pass http://127.0.0.1:8010;
    }

    location /health/ready {
        proxy_pass http://127.0.0.1:8010;
    }

    # 生产勿反代 /docs /openapi.json（FastAPI 在 production 已关闭）
}
