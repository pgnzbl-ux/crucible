# Crucible Nginx 反代 — API(8010) + 前端静态 + SSE 透传
# 安装: cp nginx-crucible.conf /etc/nginx/conf.d/crucible.conf && nginx -t && systemctl reload nginx
#
# 前置: 前端已构建（frontend/dist）；证书路径按实际替换（示例用 certbot）

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name crucible.example.com;          # ← 替换
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name crucible.example.com;          # ← 替换

    ssl_certificate     /etc/letsencrypt/live/crucible.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crucible.example.com/privkey.pem;

    # ── 前端静态 ──
    root /opt/crucible/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;      # SPA 路由回退
    }

    # ── API 反代 ──
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 文件上传（PoC 证据等）
        client_max_body_size 50m;
    }

    # ── SSE：禁缓冲 + 长读超时（sse.py 已带 X-Accel-Buffering: no，双保险）──
    location /api/v1/tasks/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;              # 任务全程可能数小时
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
    }

    # ── Swagger / OpenAPI ──
    location /docs  { proxy_pass http://127.0.0.1:8010; }
    location /openapi.json { proxy_pass http://127.0.0.1:8010; }
}
