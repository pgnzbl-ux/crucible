# Crucible 基础设施 — PostgreSQL 16 + Redis 7 + MinIO
#
# 端口约定：与宿主机默认端口错开（5432/6379 已被占用，改用 5433/6380）
#   - PostgreSQL  5433:5432
#   - Redis       6380:6379
#   - MinIO API   9000 / Console 9001
#
# 使用：
#   cd infrastructure && docker compose up -d
#   docker compose ps   # 查看健康状态

name: crucible-infra

services:
  postgres:
    image: postgres:16-alpine
    container_name: crucible-postgres
    environment:
      POSTGRES_USER: crucible
      POSTGRES_PASSWORD: crucible_secret
      POSTGRES_DB: crucible
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crucible -d crucible"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - crucible-net

  redis:
    image: redis:7-alpine
    container_name: crucible-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - crucible-net

  minio:
    image: minio/minio:latest
    container_name: crucible-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - crucible-net

  # 一次性初始化：创建 S3 bucket（幂等）
  createbuckets:
    image: minio/mc:latest
    container_name: crucible-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/crucible-artifacts &&
      mc mb --ignore-existing local/crucible-evidence &&
      mc mb --ignore-existing local/crucible-source &&
      echo 'buckets ready' &&
      exit 0
      "
    restart: "no"
    networks:
      - crucible-net

networks:
  crucible-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
