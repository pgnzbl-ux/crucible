# Crucible 基础设施 — PostgreSQL 16 + Redis 7 + MinIO
#
# 端口仅绑回环（127.0.0.1），避免开发机局域网/公网误暴露。
# 口令与映射端口由同目录 .env 注入（见 .env.example）；勿把含生产密钥的 .env 提交进库。
#
# 使用：
#   cd infrastructure && cp -n .env.example .env && docker compose up -d
#   docker compose ps

name: crucible-infra

services:
  postgres:
    image: postgres:16-alpine
    container_name: crucible-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crucible}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crucible_secret}
      POSTGRES_DB: ${POSTGRES_DB:-crucible}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - crucible-net

  redis:
    image: redis:7-alpine
    container_name: crucible-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-crucible_redis}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:-crucible_redis}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - crucible-net

  minio:
    image: minio/minio:latest
    container_name: crucible-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - crucible-net

  # 一次性初始化：创建 S3 bucket（幂等）
  createbuckets:
    image: minio/mc:latest
    container_name: crucible-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/crucible-durable &&
      mc mb --ignore-existing local/crucible-task &&
      mc mb --ignore-existing local/crucible-public &&
      echo 'buckets ready' &&
      exit 0
      "
    restart: "no"
    networks:
      - crucible-net

networks:
  crucible-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
