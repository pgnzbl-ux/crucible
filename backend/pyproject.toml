[project]
name = "crucible"
version = "0.3.0"
description = "Crucible - AI-powered vulnerability verification platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",  # 锁版本：bcrypt 5.0 与 passlib 不兼容（见 docs/development-guide.md §5.4 踩坑）
    "redis>=5.2.0",
    "celery>=5.4.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "psutil>=6.1.0",
    "aiosqlite>=0.20.0",
    "minio>=7.2.0",  # S3 兼容对象存储客户端（report/storage.py）
    "docker>=7.0.0",  # Docker SDK（core/agent_runner.py 拉起 agent-runner 容器）
    "pyyaml>=6.0.3",  # AI 生成 docker-compose.yml 的宿主执行前安全解析
    # claude-agent-sdk 仅 agent-runner 容器内需要（见 infrastructure/agent-runner/requirements.txt）
    # 后端通过 docker SDK 拉起容器，不直接 import SDK，故不在此列出（省 297MB CLI 二进制）
]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
