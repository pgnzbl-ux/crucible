rules:
  - id: sqlalchemy-order-by-column
    languages:
      - python
    severity: ERROR
    mode: taint
    message: >-
      Web request input flows into SQLAlchemy order_by as a column / text
      fragment. Prefer a whitelist of Column objects (or asc/desc of known
      columns) instead of passing user-controlled strings into order_by.
    metadata:
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp:
        - A01:2017 - Injection
        - A03:2021 - Injection
      category: security
      technology:
        - sqlalchemy
        - flask
        - django
        - fastapi
        - python
      subcategory:
        - vuln
      confidence: MEDIUM
      likelihood: HIGH
      impact: HIGH
      crucible-overlay: true
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.$W
          - pattern: request.GET
          - pattern: request.POST
          - patterns:
              - pattern-inside: |
                  def $F(..., $P: $T = Query(...), ...):
                      ...
              - pattern: $P
          - patterns:
              - pattern-inside: |
                  async def $F(..., $P: $T = Query(...), ...):
                      ...
              - pattern: $P
          - patterns:
              - pattern-inside: |
                  def $F(..., $P: $T = Path(...), ...):
                      ...
              - pattern: $P
          - patterns:
              - pattern-inside: |
                  async def $F(..., $P: $T = Path(...), ...):
                      ...
              - pattern: $P
          - patterns:
              - pattern-inside: |
                  def $F(..., $P: $T = Body(...), ...):
                      ...
              - pattern: $P
          - patterns:
              - pattern-inside: |
                  async def $F(..., $P: $T = Body(...), ...):
                      ...
              - pattern: $P
          - patterns:
              - pattern-inside: |
                  def $F(..., $P: Request, ...):
                      ...
              - pattern: $P
          - patterns:
              - pattern-inside: |
                  async def $F(..., $P: Request, ...):
                      ...
              - pattern: $P
          - pattern: $REQ.query_params
          - pattern: $REQ.path_params
    pattern-sinks:
      - pattern-either:
          - patterns:
              - pattern: $Q.order_by($COL, ...)
              - focus-metavariable: $COL
          - patterns:
              - pattern: $Q.order_by(text($COL), ...)
              - focus-metavariable: $COL
          - patterns:
              - pattern: order_by($COL, ...)
              - focus-metavariable: $COL
          - patterns:
              - pattern: order_by(text($COL), ...)
              - focus-metavariable: $COL
    pattern-sanitizers:
      - pattern-either:
          - pattern: int(...)
          - patterns:
              - pattern-inside: |
                  $W = {...}
                  ...
              - pattern-either:
                  - pattern: $W[$KEY]
                  - pattern: $W.get($KEY, ...)
